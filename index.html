<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarunya 2.0 | MITS Gwalior </title>
    <meta name="description"
        content="Aarunya 2.0 - The ultimate college fest at MITS Gwalior. Explore our interactive 3D campus with the KidCore-Retro theme - Neon Blue, UV Purple, Holographic vibes." />
    <meta name="author" content="MITS Gwalior" />
    <meta name="keywords" content="Aarunya, MITS Gwalior, college fest, KidCore-Retro, 3D campus, festival" />
    <meta name="theme-color" content="#0a0a1f" />

    <meta property="og:title" content="Aarunya 2.0 - MITS Gwalior Fest" />
    <meta property="og:description"
        content="Experience the KidCore-Retro theme at Aarunya 2.0 - Interactive 3D campus explorer" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MITSGwalior" />

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Google Fonts via link (non-blocking) instead of CSS @import (blocking) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono&display=swap">
    </noscript>

    <!-- Preload local fonts for faster loading -->
    <link rel="preload" href="/fonts/orbitron-v31-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/fredoka-v14-latin-700.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload LCP image for faster initial render -->
    <link rel="preload" href="/bg-phone.avif" as="image" type="image/avif" fetchpriority="high">

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
